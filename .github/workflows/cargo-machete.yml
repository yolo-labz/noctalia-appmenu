name: cargo-machete

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "bridge/Cargo.toml"
      - "bridge/Cargo.lock"
      - ".github/workflows/cargo-machete.yml"
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    name: detect unused deps
    # Runs on the vm103 runner: the nix devShell below supplies cargo + cargo-machete,
    # and no runner carries a `desktop` label (the job sat queued forever with it).
    runs-on: [self-hosted, Linux, X64, noctalia-appmenu]
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Use the nix devShell instead of the bnjbvr/cargo-machete
      # action — the action's binary fallback chain (precompiled
      # tarball → `cargo install`) breaks against this runner's
      # rustup-without-default state, and the devShell already pins
      # cargo-machete via nixpkgs.
      - name: cargo machete (via nix devShell)
        run: nix develop --command cargo machete bridge
